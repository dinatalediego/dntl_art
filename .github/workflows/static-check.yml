name: Static checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check gameplay.js
          node --check telemetry.js
          node --check retention.js
      - name: Check required assets
        run: |
          test -s index.html
          test -s styles.css
          test -s gameplay.css
          test -s retention.css
          test -s vercel.json
